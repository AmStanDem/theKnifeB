version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: knife_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: theknife
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    volumes:
      - knife_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - knife_net

volumes:
  knife_db_data:

networks:
  knife_net:
    driver: bridge